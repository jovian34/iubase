<form
    action="{% url "edit_player" player_id %}"
    method="post"
    hx-post="{% url "edit_player" player_id %}"
    hx-target="#player-info"
    hx-swap="outerHTML">
    {% csrf_token %}
    {{ form }}
    <button class="edit-button" type="submit" value="Submit">Submit Updated Player Info</button>
</form>
