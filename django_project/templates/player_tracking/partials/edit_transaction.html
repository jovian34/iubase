<form
    action="{% url "edit_transaction" transaction.pk %}"
    method="post"
    hx-post="{% url "edit_transaction" transaction.pk %}"
    hx-target="#transactions"
    hx-swap="outerHTML">
    {% csrf_token %}
    {{ form }}
    <button class="edit-button" type="submit" value="Submit">Submit Updated Transaction</button>
</form>
