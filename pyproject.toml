[project]
name = "iubase"
version = "2026.11.15.0903"
requires-python = "==3.15.2"
dependencies = [
    "asgiref==3.13.0",
    "bs4>=0.0.2",
    "coverage==7.17.3",
    "django==6.1.3",
    "django-allauth[socialaccount]==65.22.1",
    "execnet==2.1.2",
    "gunicorn==27.0.1",
    "iniconfig==2.3.1",
    "markdown==3.11.3",
    "packaging==26.3",
    "pluggy==1.7.0",
    "psycopg==3.3.9",
    "psycopg-binary==3.3.9",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "pytest-xdist==3.8.0",
    "python-dotenv==1.2.4",
    "pytz==2026.6",
    "requests>=2.34.2",
    "sqlparse==0.6.1",
    "typing-extensions==4.16.0",
]

[tool.uv]
package = false
constraint-dependencies = ["urllib3>=2.6.3"]

[tool.ruff]
extend-exclude = ["tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_project.settings"
python_files = "test_*.py"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
